  <rect x="20" y="136" width="25" height="28" fill="#8CB3D9" rx="1"/>
  <rect x="110" y="136" width="25" height="28" fill="#8CB3D9" rx="1"/>
  <rect x="205" y="136" width="25" height="28" fill="#8CB3D9" rx="1"/>
